[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "p3-profit-reporting"
version = "0.1.0"
description = "E-commerce profit reporting on a WooCommerce-shaped store (synthetic data)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "tenacity>=9.0",
    "dbt-core==1.12.6",
    "dbt-postgres==1.11.0",
    "google-genai==3.0.0",
    "playwright==1.65.1",
    "python-pptx==1.0.2",
    "matplotlib>=3.10",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pypdf>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
p3 = ["db/*.sql", "llm/prompts/*.md", "report/templates/*.j2", "report/assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["dbt: needs a full dbt build against p3_test (slower)"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
